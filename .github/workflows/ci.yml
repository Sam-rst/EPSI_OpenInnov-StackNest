name: CI

# Workflow rapide declenche sur chaque push / PR. Les taches lentes (e2e,
# mutation testing, deep security) vivent dans ci-nightly.yml (schedule 20h).
#
# Topologie : 1 job par stack × concern, ORDONNES en WORKFLOW via `needs` :
#
#   qualite → build → tests → securite → metrics
#
# Fail-fast : si le lint casse on ne build pas ; si ca ne build pas on ne teste
# pas ; etc. Chaque job appelle les COMPOSITES poe (back) / npm (front) — jamais
# d'outil en direct. Setup unique (setup-api / setup-web) puis steps granulaires.
# Nommage STACK-FIRST coherent : `<stack>-<concern>` (api-*, web-*, infra-*).
#
# SAST semgrep : plus de jobs `semgrep-api`/`semgrep-web` orphelins (ils
# lancaient l'image Docker en direct, sans appeler de script de stack). semgrep
# est un outil Python POLYGLOTTE : il est desormais ENGLOBE dans la securite de
# chaque stack via les composites RACINE `api-security` / `web-security`
# (= securite de stack `:code` + `uvx semgrep` `:sast`, scope p/python ou
# p/typescript). Voir pyproject.toml racine et CLAUDE.md « Securite / Semgrep ».
#
# Les 3 stacks (api / web / infra) tournent en PARALLELE entre elles ; a
# l'interieur d'une stack, l'ordre ci-dessus est SERIEL (chaine de `needs`).
# Jobs transverses INDEPENDANTS (parallele) : secrets-scan (gitleaks, historique
# git complet) et outils-test (tooling Python racine). Les *-metrics sont
# informationnels (continue-on-error) et hors sentinelle.
#
# Sentinelle finale `ci-ok` attend les jobs BLOQUANTS. C'est le seul required
# check a configurer cote branch protection.
#
# Le setup repete (checkout + setup-uv + uv sync pour api, checkout + setup-node
# + npm ci pour web) est factorise dans .github/actions/setup-{api,web}.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Baseline « deny-all » au niveau workflow (hardening GitHub recommande) :
# aucune permission n'est accordee globalement au GITHUB_TOKEN. Chaque job
# redeclare le scope minimal dont il a besoin (`contents: read` pour checkout).
# Resout SonarCloud S8264/S8233 (« move permission from workflow level to job
# level ») sans elargir la surface du token.
permissions: {}

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stack API — apps/api (Python 3.13, uv, FastAPI)
  # Workflow seriel : qualite → build → tests → securite → metrics.
  # ═══════════════════════════════════════════════════════════

  api-qualite:
    name: api-qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: lint
        run: uv run --directory apps/api poe lint
      - name: format:check
        run: uv run --directory apps/api poe format:check
      - name: typecheck
        run: uv run --directory apps/api poe typecheck

  api-build:
    name: api-build
    needs: [api-qualite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image (load local pour Syft)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          push: false
          load: true
          tags: stacknest-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Generate SBOM (Syft) pour tracabilite supply-chain
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: stacknest-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json
          output-file: sbom-api.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api
          path: sbom-api.spdx.json
          retention-days: 30

  api-test:
    name: api-test
    needs: [api-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      # test:cov lance la suite complete unit+integ avec le seuil
      # --cov-fail-under=80 (testcontainers/Docker disponibles sur le runner).
      - name: test:cov
        run: uv run --directory apps/api poe test:cov

  api-securite:
    name: api-securite
    needs: [api-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-api
      # Composite RACINE englobant : securite de la stack (`:code` =
      # ruff/bandit + pip-audit) PUIS semgrep SAST (`:sast` = uvx semgrep
      # p/python + p/security-audit). uv/uvx fournis par setup-api.
      - name: api-security (bandit + pip-audit + semgrep p/python)
        run: uv run poe api-security

  # Job informationnel (complexite / Maintainability Index) — JAMAIS bloquant.
  api-metrics:
    name: api-metrics
    needs: [api-securite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: metrics
        run: uv run --directory apps/api poe metrics

  # ═══════════════════════════════════════════════════════════
  # Stack WEB — apps/web (Node 22, Vite, React)
  # Workflow seriel : qualite → build → tests → securite → metrics.
  # NB : la stack cible exclusivement `apps/web`. `apps/web-mockup/`
  # (reference design, STN-157) est volontairement HORS quality gate.
  # ═══════════════════════════════════════════════════════════

  web-qualite:
    name: web-qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: lint
        run: npm --prefix apps/web run lint
      - name: format:check
        run: npm --prefix apps/web run format:check
      - name: typecheck
        run: npm --prefix apps/web run typecheck

  web-build:
    name: web-build
    needs: [web-qualite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Web image (load local pour Syft)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          push: false
          load: true
          tags: stacknest-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Generate SBOM (Syft) pour tracabilite supply-chain
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: stacknest-web:ci
          format: spdx-json
          artifact-name: sbom-web.spdx.json
          output-file: sbom-web.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web
          path: sbom-web.spdx.json
          retention-days: 30

  web-test:
    name: web-test
    needs: [web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: test
        run: npm --prefix apps/web run test

  web-securite:
    name: web-securite
    needs: [web-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/setup-web
      # Composite RACINE englobant : securite de la stack (`:code` =
      # eslint-plugin-security + npm audit) PUIS semgrep SAST (`:sast` = uvx
      # semgrep p/typescript + p/security-audit). setup-web fournit node/npm
      # pour `:code` ; setup-uv fournit uv/uvx pour semgrep `:sast`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: web-security (eslint-security + npm audit + semgrep p/typescript)
        run: uv run poe web-security

  # Job informationnel (metriques) — JAMAIS bloquant.
  web-metrics:
    name: web-metrics
    needs: [web-securite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: metrics
        run: npm --prefix apps/web run metrics

  # ═══════════════════════════════════════════════════════════
  # Lane INFRA — infra/ (Terraform, Docker Compose, GitHub Actions)
  # Workflow seriel : qualite → build → tests → securite.
  # Pas de composite action factorisable : chaque concern-job utilise un
  # sous-ensemble d'outils different (actionlint + terraform pour qualite,
  # docker CLI pour build, terraform+uv pour test, checkov pour securite).
  # Pas de *-metrics infra (pas d'outil de metrique dediee a l'IaC).
  # ═══════════════════════════════════════════════════════════

  infra-qualite:
    name: infra-qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (GitHub workflows)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"
      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate (tous les environnements)
        run: |
          set -euo pipefail
          for env_dir in infra/terraform/environments/*/; do
            echo "::group::$env_dir"
            (cd "$env_dir" && terraform init -backend=false -input=false -no-color && terraform validate -no-color)
            echo "::endgroup::"
          done

  infra-build:
    name: infra-build
    needs: [infra-qualite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config (base + dev override)
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null

  infra-test:
    name: infra-test
    needs: [infra-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"
      - uses: ./.github/actions/setup-api
      - name: Run shell tests
        run: |
          set -euo pipefail
          for script in tests/infra/test_*.sh; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done

  infra-securite:
    name: infra-securite
    needs: [infra-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # L'action passe l'input `framework` comme UN SEUL argv au CLI checkov : la
      # version epinglee (checkov moderne, `--framework` en nargs='+') refuse la
      # forme `terraform,dockerfile`. On scinde donc en deux etapes a framework
      # UNIQUE (chacune un token valide).
      # Gate BLOQUANT (STN-179) : `soft_fail` retire apres avoir prouve 0
      # violation. « Clean as You Code » : tout nouveau finding Checkov bloque.
      - name: Checkov (Terraform policy)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
      - name: Checkov (Dockerfile policy)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: dockerfile
          quiet: true

  # ═══════════════════════════════════════════════════════════
  # Jobs transverses INDEPENDANTS (paralleles, hors workflow de stack).
  # ═══════════════════════════════════════════════════════════

  # Securite globale : scan transverse (historique git complet, tous fichiers).
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requis : gitleaks scanne l'historique git complet
      - name: Install gitleaks
        run: |
          VERSION=8.27.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: gitleaks detect (secrets dans le code + historique)
        run: gitleaks detect --source=. --verbose --redact --no-banner

  # Outils racine — scripts/ (tooling Python du depot : worktree, next-version,
  # validateur commit-msg…). Projet poe RACINE (pyproject.toml racine), PAS
  # apps/api : on lance `uv run poe test` SANS `--directory`.
  outils-test:
    name: outils-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: test (pytest scripts)
        run: uv run poe test

  # ═══════════════════════════════════════════════════════════
  # Sentinelle finale — seul required check pour branch protection.
  # ═══════════════════════════════════════════════════════════

  ci-ok:
    name: ci-ok
    # Liste explicite des 14 jobs BLOQUANTS : par stack (api/web/infra) les 4
    # concerns qualite/build/test/securite (semgrep est englobe dans *-securite),
    # plus les 2 transverses outils-test + secrets-scan. Les *-metrics sont
    # informationnels (continue-on-error) et volontairement ABSENTS.
    needs:
      - api-qualite
      - api-build
      - api-test
      - api-securite
      - web-qualite
      - web-build
      - web-test
      - web-securite
      - infra-qualite
      - infra-build
      - infra-test
      - infra-securite
      - outils-test
      - secrets-scan
    if: always()
    runs-on: ubuntu-latest
    permissions: {} # sentinelle : ne checkout rien, ne touche pas au token
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULT_API_QUALITE: ${{ needs.api-qualite.result }}
          RESULT_API_BUILD: ${{ needs.api-build.result }}
          RESULT_API_TEST: ${{ needs.api-test.result }}
          RESULT_API_SECURITE: ${{ needs.api-securite.result }}
          RESULT_WEB_QUALITE: ${{ needs.web-qualite.result }}
          RESULT_WEB_BUILD: ${{ needs.web-build.result }}
          RESULT_WEB_TEST: ${{ needs.web-test.result }}
          RESULT_WEB_SECURITE: ${{ needs.web-securite.result }}
          RESULT_INFRA_QUALITE: ${{ needs.infra-qualite.result }}
          RESULT_INFRA_BUILD: ${{ needs.infra-build.result }}
          RESULT_INFRA_TEST: ${{ needs.infra-test.result }}
          RESULT_INFRA_SECURITE: ${{ needs.infra-securite.result }}
          RESULT_OUTILS_TEST: ${{ needs.outils-test.result }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
        run: |
          echo "qualite  | api=$RESULT_API_QUALITE | web=$RESULT_WEB_QUALITE | infra=$RESULT_INFRA_QUALITE"
          echo "build    | api=$RESULT_API_BUILD | web=$RESULT_WEB_BUILD | infra=$RESULT_INFRA_BUILD"
          echo "test     | api=$RESULT_API_TEST | web=$RESULT_WEB_TEST | infra=$RESULT_INFRA_TEST | outils=$RESULT_OUTILS_TEST"
          echo "securite | api=$RESULT_API_SECURITE | web=$RESULT_WEB_SECURITE | infra=$RESULT_INFRA_SECURITE (semgrep englobe dans api/web)"
          echo "global   | secrets-scan=$RESULT_SECRETS"
          for r in \
            "$RESULT_API_QUALITE" "$RESULT_API_BUILD" "$RESULT_API_TEST" "$RESULT_API_SECURITE" \
            "$RESULT_WEB_QUALITE" "$RESULT_WEB_BUILD" "$RESULT_WEB_TEST" "$RESULT_WEB_SECURITE" \
            "$RESULT_INFRA_QUALITE" "$RESULT_INFRA_BUILD" "$RESULT_INFRA_TEST" "$RESULT_INFRA_SECURITE" \
            "$RESULT_OUTILS_TEST" "$RESULT_SECRETS"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::At least one required job failed (result=$r)"
              exit 1
            fi
          done
          echo "✅ All required CI jobs green (qualite → build → test → securite par stack + outils + secrets)"
