name: CI

# Workflow rapide (~2-3 min cible) declenche sur chaque push / PR.
# Les taches lentes (e2e, mutation testing, deep security) vivent dans
# ci-nightly.yml et s'executent a 20h via schedule.
#
# Topologie : 1 job par stack × concern (qualite / securite / test /
# metrics), chaque job appelant les COMPOSITES poe (back) / npm (front)
# — jamais d'outil en direct. Setup unique (setup-api / setup-web) puis
# steps granulaires. Les concern-jobs d'une meme stack tournent en
# PARALLELE (plus de chainage sequentiel `needs:` entre concerns) ; seuls
# les builds attendent leur job de test (build-api ← api-test, build-web ←
# web-test). La lane infra garde son chainage propre.
#
# Sentinelle finale `ci-ok` attend les jobs bloquants. C'est le seul
# required check a configurer cote branch protection.
#
# Le setup repete (checkout + setup-uv + uv sync pour la stack api,
# checkout + setup-node + npm ci pour la stack web) est factorise dans
# des composite actions sous .github/actions/setup-{api,web}/action.yml.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Baseline « deny-all » au niveau workflow (hardening GitHub recommande) :
# aucune permission n'est accordee globalement au GITHUB_TOKEN. Chaque job
# redeclare le scope minimal dont il a besoin (`contents: read` pour checkout).
# Resout SonarCloud S8264/S8233 (« move permission from workflow level to job
# level ») sans elargir la surface du token.
permissions: {}

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stack API — apps/api (Python 3.13, uv, FastAPI)
  # Jobs par concern : qualite / securite / test / metrics.
  # Setup-api UNE fois par job, puis steps granulaires via poe.
  # ═══════════════════════════════════════════════════════════

  api-qualite:
    name: api-qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: lint
        run: uv run --directory apps/api poe lint
      - name: format:check
        run: uv run --directory apps/api poe format:check
      - name: typecheck
        run: uv run --directory apps/api poe typecheck

  api-securite:
    name: api-securite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: security:lint
        run: uv run --directory apps/api poe security:lint
      - name: security:deps
        run: uv run --directory apps/api poe security:deps

  api-test:
    name: api-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      # test:cov lance la suite complete unit+integ avec le seuil
      # --cov-fail-under=80 (testcontainers/Docker disponibles sur le
      # runner ubuntu-latest, comme pour les anciens test-unit/integ).
      - name: test:cov
        run: uv run --directory apps/api poe test:cov

  # Job informationnel (complexite / metriques) — JAMAIS bloquant.
  api-metrics:
    name: api-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
      - name: metrics
        run: uv run --directory apps/api poe metrics

  # SAST semgrep API — image EPINGLEE (tag + digest) pour des scans
  # reproductibles : pas de `:latest` flottant qui ferait varier les
  # regles/findings d'un run a l'autre. Bump volontaire et trace dans le
  # commit. Resout SonarCloud (supply-chain / reproductibilite). Voir
  # CLAUDE.md « Securite / Semgrep ».
  semgrep-api:
    name: semgrep-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.166.0@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (rules python + security-audit, ERROR only)
        run: semgrep scan --config=p/python --config=p/security-audit --error --severity=ERROR apps/api

  build-api:
    name: build-api
    needs: [api-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image (load local pour Syft)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          push: false
          load: true
          tags: stacknest-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Generate SBOM (Syft) pour tracabilite supply-chain
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: stacknest-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json
          output-file: sbom-api.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api
          path: sbom-api.spdx.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # Stack WEB — apps/web (Node 22, Vite, React)
  # Jobs par concern : qualite / securite / test / metrics.
  # Setup-web UNE fois par job, puis steps granulaires via npm.
  # ═══════════════════════════════════════════════════════════
  # NB : la stack cible exclusivement `apps/web` (working-directory /
  # context). `apps/web-mockup/` (référence design issue de la branche
  # `mockups`, STN-157) est volontairement HORS quality gate : pas de
  # workspaces root, aucun job ne le référence. C'est une archive de
  # design vivante, non production. Chaque feature qu'elle illustre est
  # redéveloppée en TDD strict dans `apps/web`. Voir
  # docs/superpowers/specs/2026-06-04-integration-mockup-reference.md.

  web-qualite:
    name: web-qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: lint
        run: npm --prefix apps/web run lint
      - name: format:check
        run: npm --prefix apps/web run format:check
      - name: typecheck
        run: npm --prefix apps/web run typecheck

  web-securite:
    name: web-securite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: security:lint
        run: npm --prefix apps/web run security:lint
      - name: security:deps
        run: npm --prefix apps/web run security:deps

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: test
        run: npm --prefix apps/web run test

  # Job informationnel (metriques) — JAMAIS bloquant.
  web-metrics:
    name: web-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web
      - name: metrics
        run: npm --prefix apps/web run metrics

  # SAST semgrep WEB — image EPINGLEE (tag + digest), idem stack API :
  # scans reproductibles, pas de `:latest`. Garder les deux jobs alignes
  # sur la meme version au prochain bump. Voir CLAUDE.md « Securite / Semgrep ».
  semgrep-web:
    name: semgrep-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.166.0@sha256:c180f0c93a17b420c0af5006214a29d3c747c5459c732b740191adf657dd0068
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (rules typescript + security-audit, ERROR only)
        run: semgrep scan --config=p/typescript --config=p/security-audit --error --severity=ERROR apps/web

  build-web:
    name: build-web
    needs: [web-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Web image (load local pour Syft)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          push: false
          load: true
          tags: stacknest-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Generate SBOM (Syft) pour tracabilite supply-chain
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: stacknest-web:ci
          format: spdx-json
          artifact-name: sbom-web.spdx.json
          output-file: sbom-web.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web
          path: sbom-web.spdx.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # Lane INFRA — infra/ (Terraform, Docker Compose, GitHub Actions)
  # ═══════════════════════════════════════════════════════════
  # Pas de composite action factorisable : chaque job infra utilise un
  # sous-ensemble d'outils different (actionlint seul, terraform seul,
  # terraform+uv pour test-infra, docker CLI pour build-stack).

  lint-infra:
    name: lint-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (GitHub workflows)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

  format-infra:
    name: format-infra
    needs: [lint-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"
      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

  typecheck-infra:
    name: typecheck-infra
    needs: [format-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"
      - name: terraform validate (tous les environnements)
        run: |
          set -euo pipefail
          for env_dir in infra/terraform/environments/*/; do
            echo "::group::$env_dir"
            (cd "$env_dir" && terraform init -backend=false -input=false -no-color && terraform validate -no-color)
            echo "::endgroup::"
          done

  security-infra:
    name: security-infra
    needs: [typecheck-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # L'action passe l'input `framework` comme UN SEUL argv au CLI checkov : la
      # version epinglee (checkov moderne, `--framework` en nargs='+') refuse la
      # forme `terraform,dockerfile`. On scinde donc en deux etapes a framework
      # UNIQUE (chacune un token valide).
      # Gate RESTAURE BLOQUANT (STN-179) : `soft_fail` retire apres avoir prouve
      # 0 violation (Checkov local : Terraform 0 failed ; Dockerfile 179 passed /
      # 0 failed). « Clean as You Code » : tout nouveau finding Checkov bloque la PR.
      - name: Checkov (Terraform policy)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
      - name: Checkov (Dockerfile policy)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: .
          framework: dockerfile
          quiet: true

  test-infra:
    name: test-infra
    needs: [security-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"
      - uses: ./.github/actions/setup-api
      - name: Run shell tests
        run: |
          set -euo pipefail
          for script in tests/infra/test_*.sh; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done

  build-stack:
    name: build-stack
    needs: [test-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config (base + dev override)
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null

  # ═══════════════════════════════════════════════════════════
  # Security globale — job independant, pas dans une lane car scan
  # transverse (historique git complet, tous les fichiers).
  # ═══════════════════════════════════════════════════════════

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requis : gitleaks scanne l'historique git complet
      - name: Install gitleaks
        run: |
          VERSION=8.27.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: gitleaks detect (secrets dans le code + historique)
        run: gitleaks detect --source=. --verbose --redact --no-banner

  # ═══════════════════════════════════════════════════════════
  # Sentinelle finale — seul required check pour branch protection
  # ═══════════════════════════════════════════════════════════

  ci-ok:
    name: ci-ok
    # Liste explicite des jobs BLOQUANTS (1 par stack × concern + builds +
    # semgrep + infra + secrets). Les *-metrics sont informationnels
    # (continue-on-error) et volontairement ABSENTS de cette liste.
    needs:
      - api-qualite
      - web-qualite
      - api-securite
      - web-securite
      - api-test
      - web-test
      - semgrep-api
      - semgrep-web
      - build-api
      - build-web
      - build-stack
      - secrets-scan
    if: always()
    runs-on: ubuntu-latest
    permissions: {} # sentinelle : ne checkout rien, ne touche pas au token
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULT_API_QUALITE: ${{ needs.api-qualite.result }}
          RESULT_WEB_QUALITE: ${{ needs.web-qualite.result }}
          RESULT_API_SECURITE: ${{ needs.api-securite.result }}
          RESULT_WEB_SECURITE: ${{ needs.web-securite.result }}
          RESULT_API_TEST: ${{ needs.api-test.result }}
          RESULT_WEB_TEST: ${{ needs.web-test.result }}
          RESULT_SEMGREP_API: ${{ needs.semgrep-api.result }}
          RESULT_SEMGREP_WEB: ${{ needs.semgrep-web.result }}
          RESULT_BUILD_API: ${{ needs.build-api.result }}
          RESULT_BUILD_WEB: ${{ needs.build-web.result }}
          RESULT_BUILD_STACK: ${{ needs.build-stack.result }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
        run: |
          echo "qualite  | api=$RESULT_API_QUALITE | web=$RESULT_WEB_QUALITE"
          echo "securite | api=$RESULT_API_SECURITE | web=$RESULT_WEB_SECURITE"
          echo "test     | api=$RESULT_API_TEST | web=$RESULT_WEB_TEST"
          echo "semgrep  | api=$RESULT_SEMGREP_API | web=$RESULT_SEMGREP_WEB"
          echo "build    | api=$RESULT_BUILD_API | web=$RESULT_BUILD_WEB | stack=$RESULT_BUILD_STACK"
          echo "global   | secrets-scan=$RESULT_SECRETS"
          for r in \
            "$RESULT_API_QUALITE" "$RESULT_WEB_QUALITE" \
            "$RESULT_API_SECURITE" "$RESULT_WEB_SECURITE" \
            "$RESULT_API_TEST" "$RESULT_WEB_TEST" \
            "$RESULT_SEMGREP_API" "$RESULT_SEMGREP_WEB" \
            "$RESULT_BUILD_API" "$RESULT_BUILD_WEB" "$RESULT_BUILD_STACK" \
            "$RESULT_SECRETS"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::At least one required job failed (result=$r)"
              exit 1
            fi
          done
          echo "✅ All required CI jobs green (qualite, securite, test, semgrep, builds, secrets)"
