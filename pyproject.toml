# ─────────────────────────────────────────────────────────────────────────────
# Orchestrateur QUALITÉ racine (monorepo polyglotte).
#
# Ce fichier ne contient AUCUNE logique d'outil : il se contente de DÉLÉGUER aux
# composites de chaque stack — back `apps/api` (poe) et front `apps/web` (npm) —
# via les flags natifs de cwd (`uv run --directory …`, `npm --prefix …`), sans
# jamais `cd`. C'est la **carte unique et traçable** des jobs qualité, appelée
# aussi bien par les hooks git (`.pre-commit-config.yaml`) que par la CI.
#
#   uv run poe quality     # qualité statique back + front
#   uv run poe security    # sécurité back + front
#   uv run poe metrics     # métriques back + front (informationnel)
#   uv run poe pre-commit  # ce que le hook pre-commit enchaîne
#   uv run poe pre-push    # ce que le hook pre-push enchaîne
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "stacknest"
version = "0.78.0"
description = "StackNest — orchestrateur qualité racine (délègue aux stacks api/web)"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "poethepoet>=0.44.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[tool.poe.tasks]
# ---- délégués back (apps/api · poe) — un job par stack, invocable & visible ----
"api-quality"    = "uv run --directory apps/api poe quality"
"api-metrics"    = "uv run --directory apps/api poe metrics"
"api-pre-commit" = "uv run --directory apps/api poe pre-commit"
"api-pre-push"   = "uv run --directory apps/api poe pre-push"

# ---- délégués front (apps/web · npm) ----
"web-quality"    = "npm --prefix apps/web run quality"
"web-metrics"    = "npm --prefix apps/web run metrics"
"web-pre-commit" = "npm --prefix apps/web run pre-commit"
"web-pre-push"   = "npm --prefix apps/web run pre-push"

# ---- SÉCURITÉ par stack — composite ENGLOBANT : sécu de la stack (:code) +
#      semgrep SAST (:sast). semgrep est UN outil Python *polyglotte* (un seul
#      binaire scanne back ET front via des rulesets différents) : on le gère à
#      la RACINE via `uvx` (env éphémère épinglé — aucune pollution des venvs de
#      stack, aucun lock à modifier), scopé par stack (p/python sur apps/api,
#      p/typescript sur apps/web) + p/security-audit partout, en `--error
#      --severity=ERROR` (échec dur sur finding ERROR). Volontairement HORS hooks
#      (le pre-push de stack garde sa sécu sans semgrep → OK Windows) ; semgrep
#      tourne en CI (Linux) et, en local Windows, via Docker — cf. CLAUDE.md.
"api-security:code" = "uv run --directory apps/api poe security"
"api-security:sast" = "uvx --from semgrep==1.166.0 semgrep scan --config=p/python --config=p/security-audit --error --severity=ERROR apps/api"
"api-security"      = ["api-security:code", "api-security:sast"]
"web-security:code" = "npm --prefix apps/web run security"
"web-security:sast" = "uvx --from semgrep==1.166.0 semgrep scan --config=p/typescript --config=p/security-audit --error --severity=ERROR apps/web"
"web-security"      = ["web-security:code", "web-security:sast"]

# ---- composites cross-stack (la carte lisible) ----
quality      = ["api-quality",    "web-quality"]
security     = ["api-security",   "web-security"]
metrics      = ["api-metrics",    "web-metrics"]
"pre-commit" = ["api-pre-commit", "web-pre-commit"]
"pre-push"   = ["api-pre-push",   "web-pre-push"]
# Tests des OUTILS racine (scripts/ — ex. validateur de message commit-msg).
# Les tests applicatifs vivent dans chaque stack (api `test:cov`, web `test`).
test         = "pytest scripts"
ci           = ["quality", "security", "test"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
